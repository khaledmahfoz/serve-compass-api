version: "3.8"
networks:
  serve-compass:
services:
  serve-compass-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serve-compass-api
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serve-compass
  postgres:
    image: postgres:15-alpine
    container_name: serve-compass-db
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    environment:
      POSTGRES_USER: ${DATABASE_USER_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_PORT: ${DATABASE_PORT}
      POSTGRES_DB: ${DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USER_NAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - serve-compass
  redis:
    image: redis:7-alpine
    container_name: serve-compass-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --port ${REDIS_PORT} --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - serve-compass
